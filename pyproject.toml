[project]
name = "legacyverse-backend"
version = "0.1.0"
description = "LegacyVerse Django REST API backend"
requires-python = ">=3.14"
dependencies = [
   "django>=5.1.4",
   "django-allauth>=0.62.1",
   "django-cors-headers>=4.3.1",
   "djangorestframework>=3.15.2",
   "djangorestframework-simplejwt>=5.5.1",
   "drf-spectacular>=0.29.0",
   "google-auth>=2.53.0",
   "gunicorn>=26.0.0",
   "openai>=2.40.0",
   "pillow>=10.4.0",
   "psycopg2-binary>=2.9.12",
   "python-decouple>=3.8",
   "requests>=2.34.2",
   "resend>=2.30.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
]
